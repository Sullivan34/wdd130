<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <h2>My Favorite Devotionals</h2>

        <table class="devo-table">
          <thead>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Michelle D. Craig</td>
              <td>Hope In Thine End</td>
              <td>BYU-Idaho Center</td>
              <td>2024</td>
            </tr>
            <tr>
              <td>Gabriel W. Reid</td>
              <td>Fumbling Is Not Failing</td>
              <td>BYU-Idaho Center</td>
              <td>2024</td>
            </tr>
            <tr>
              <td>Henry J. Eyring</td>
              <td>Making Changes in Our Lives</td>
              <td>BYU-Idaho Center</td>
              <td>2021</td>
            </tr>
          </tbody>
        </table>

        <h2>Add a Devotional</h2>

        <form class="devo-form">
          <label for="speaker">Speaker</label>
          <input type="text" id="speaker" name="speaker" placeholder="Elder Clark G. Gilbert">

          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="Devotional title">

          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="BYU-Idaho Center">

          <label for="year">Year</label>
          <input type="number" id="year" name="year" min="1900" max="2100" placeholder="2025">

          <button type="submit">Add Devotional</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
