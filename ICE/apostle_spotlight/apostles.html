<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
                    body {
            background-color: #E8ECED;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 800px;
            height: 600px;
            margin: 20px auto;
            border: 8px solid black;
            border-radius: 30px;
            background-image: url("images/christus.webp");
            background-size: cover;
        }

        .content {
            margin-left: 220px;
            text-align: center;
        }

        h1, h2 {
            color: white;
            font-weight: normal;
            margin: 10px 0;
        }

        .apostle {
            border: 5px solid white;
            border-radius: 50%;
            margin: 5px 12px;
        }

        .apostle:hover {
            border-color: gold;
        }

        .presidency .apostle {
            width: 100px;
            height: 100px;
        }

        .presidency .president {
            width: 120px;
            height: 120px;
        }

        .twelve .apostle {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
        <div class="container">

        <div class="content">
            <h1>First Presidency</h1>
            <div class="presidency">
                <img class="apostle" src="images/eyring.webp" alt="Henry B. Eyring">
                <img class="apostle president" src="images/oaks.webp" alt="Dallin H. Oaks">
                <img class="apostle" src="images/christofferson.webp" alt="D. Todd Christofferson">
            </div>

            <h2>Quorum of the Twelve Apostles</h2>
            <div class="twelve">
                <img class="apostle" src="images/uchtdorf.webp" alt="Dieter F. Uchtdorf">
                <img class="apostle" src="images/bednar.webp" alt="David A. Bednar">
                <img class="apostle" src="images/cook.webp" alt="Quentin L. Cook">
                <img class="apostle" src="images/anderson.webp" alt="Neil L. Andersen">
                <img class="apostle" src="images/rasband.webp" alt="Ronald A. Rasband">
                <img class="apostle" src="images/stevenson.webp" alt="Gary E. Stevenson">
                <img class="apostle" src="images/renlund.webp" alt="Dale G. Renlund">
                <img class="apostle" src="images/gong.webp" alt="Gerrit W. Gong">
                <img class="apostle" src="images/soares.webp" alt="Ulisses Soares">
                <img class="apostle" src="images/kearon.webp" alt="Patrick Kearon">
                <img class="apostle" src="images/causse.webp" alt="Gérald Caussé">
                <img class="apostle" src="images/gilbert.webp" alt="Clark G. Gilbert">
            </div>
        </div>
    </div>
</body>
</html>
